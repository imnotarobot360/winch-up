# PostgREST, pointed at the local Postgres. `authenticator` owns nothing and can only
# SET ROLE to anon / authenticated / service_role, exactly as Supabase wires it.
db-uri = "postgres://authenticator:authenticator@127.0.0.1:55432/txrecover"
db-schemas = "public"
db-anon-role = "anon"
db-extra-search-path = "public, extensions"
jwt-secret = "txrecover-local-dev-jwt-secret-at-least-32-chars"
server-host = "127.0.0.1"
server-port = 54322
log-level = "info"
