name: CI

# Every push and every pull request. The whole point is that nobody has to remember to run it.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. A queue of stale runs helps nobody.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Needs no secrets, so it works the moment this file lands.
  #
  # `npm run verify` is typecheck, lint, 94 unit and component tests, and a production build.
  # The build runs `prebuild` first, which is four guards that have each caught something real:
  #
  #   check-messages   English and Spanish key-for-key, arrays compared item by item
  #   gen-contact-info-parity --check  the SQL and TypeScript twins tested on identical cases
  #   check-claims     no copy promising emergency rescue, guaranteed help or location tracking
  #   check-env        .env.example matches what the code actually reads, both directions
  #
  # Verified to need no environment: the build completes with .env.local removed entirely.
  # ---------------------------------------------------------------------------
  verify:
    name: typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # MATCH THE npm THE LOCKFILE WAS WRITTEN WITH.
      #
      # CI failed at npm ci on every push from 2026-09-23 to 2026-09-30 -- 44 runs, five days,
      # unnoticed, because it fails before any of this project’s own code runs. The cause is not
      # Node and not a broken lockfile:
      #
      #   npm error code EUSAGE
      #   npm ci can only install packages when your package.json and package-lock.json are in sync
      #   Missing: @swc/helpers@0.5.23 from lock file
      #
      # npm 11 writes this lockfile and accepts it; npm 10, which ships with the Node images
      # here, rejects it. Reproduced by running npm@10 against a copy of package.json and
      # package-lock.json alone, which is also the only way to see it from a machine that has
      # npm 11 -- a local npm ci passes and tells you nothing.
      #
      # Pinned rather than regenerated with npm 10, so CI runs what the developer runs. The day
      # that stops being npm 11, this line is the thing to change, and it will say so loudly.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run verify

  # ---------------------------------------------------------------------------
  # The browser suite, against a Supabase this runner starts and throws away.
  #
  # IT USED TO BE GATED ON REPOSITORY SECRETS AND HAS THEREFORE NEVER RUN. The gate checked for
  # NEXT_PUBLIC_SUPABASE_URL, the secret was never added, and the job went green having skipped
  # every test in it -- a passing tick that meant nothing, for months.
  #
  # The obvious fix was to add the secrets. It is the wrong fix, twice over:
  #
  #   * The suite signs in as admin@ / mike@ / rosa@ / pending@winchup.test, which exist only in
  #     supabase/seeds/demo.sql -- and that seed REFUSES to run against production on purpose.
  #     Pointed at production the suite fails at the first sign-in screen.
  #   * The header here used to claim the suite was read-only. It is not, and has not been since
  #     the recovery-team work: it files requests, signs people up, posts to the community and
  #     publishes membership agreements. Against production those are real rows, a real rate
  #     limit, and stray accounts somebody has to go and delete by hand. Three were deleted on
  #     2026-09-30.
  #
  # So the runner gets its OWN Supabase: real Postgres, real GoTrue, the full migration history
  # and the demo seed. Nothing shared, nothing to leak, no secret to add, and the pgTAP suites
  # -- 885 assertions that have also never run here -- come along for free.
  # ---------------------------------------------------------------------------
  browsers:
    name: end-to-end (4 viewports, 2 engines)
    runs-on: ubuntu-latest
    # supabase start pulls images, then a production build, then the suite on one worker.
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # MATCH THE npm THE LOCKFILE WAS WRITTEN WITH.
      #
      # CI failed at npm ci on every push from 2026-09-23 to 2026-09-30 -- 44 runs, five days,
      # unnoticed, because it fails before any of this project’s own code runs. The cause is not
      # Node and not a broken lockfile:
      #
      #   npm error code EUSAGE
      #   npm ci can only install packages when your package.json and package-lock.json are in sync
      #   Missing: @swc/helpers@0.5.23 from lock file
      #
      # npm 11 writes this lockfile and accepts it; npm 10, which ships with the Node images
      # here, rejects it. Reproduced by running npm@10 against a copy of package.json and
      # package-lock.json alone, which is also the only way to see it from a machine that has
      # npm 11 -- a local npm ci passes and tells you nothing.
      #
      # Pinned rather than regenerated with npm 10, so CI runs what the developer runs. The day
      # that stops being npm 11, this line is the thing to change, and it will say so loudly.
      - run: npm install -g npm@11

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts Postgres, GoTrue, PostgREST and Storage in this runner and applies every
      # migration in supabase/migrations. Studio and the mail catcher are excluded because no
      # human is going to look at them here.
      - name: Start this runner's own Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      # The demo accounts, loaded deliberately rather than by config.toml's seed list -- that
      # list is reachable by `supabase db push --include-seed` and must stay reference-only.
      # mark-local.sql first: an unmarked database calls itself production and refuses this.
      - name: Load the demo data the suite signs in with
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -f scripts/local-stack/mark-local.sql \
            -f supabase/seeds/demo.sql

      # 885 assertions across nineteen suites, which have never run on CI either. They are the
      # cheapest thing in this file and they cover the rules a browser cannot see -- RLS, the
      # dispatch state machine, what account deletion scrubs.
      - name: Database suites (pgTAP)
        run: supabase test db

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run the suite
        env:
          # This runner's own stack. The anon key is read from it rather than written down,
          # because supabase start mints one per run.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SITE_URL: http://localhost:3101
          # Optional, and absent here: without it the recovery-team suite still passes -- it
          # falls back to pasting coordinates and says so in the log -- but the map leg does not
          # run. A public, URL-restricted pk. token is what belongs in this secret.
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          # Belt and braces: nothing here should reach Twilio, and this makes certain of it.
          SMS_DRY_RUN: "1"
        run: |
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$(supabase status -o json | jq -r '.ANON_KEY')"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "no anon key from supabase status"; exit 1; }
          npm run test:e2e

      - name: Keep the traces when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # NOT HERE: the 622 pgTAP assertions.
  #
  # They need Postgres with PostGIS and pgTAP, and pgTAP is not in any published PostGIS image --
  # locally it is installed by hand from a source tarball, which is not something to reproduce in
  # a workflow that has to be trustworthy. They are run with `supabase test db` against a local
  # database, or against the linked project before a release.
  #
  # Saying so here is better than a job that silently skips and turns the badge green.
  # ---------------------------------------------------------------------------
