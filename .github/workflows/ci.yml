name: CI

# Every push and every pull request. The whole point is that nobody has to remember to run it.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. A queue of stale runs helps nobody.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Needs no secrets, so it works the moment this file lands.
  #
  # `npm run verify` is typecheck, lint, 94 unit and component tests, and a production build.
  # The build runs `prebuild` first, which is four guards that have each caught something real:
  #
  #   check-messages   English and Spanish key-for-key, arrays compared item by item
  #   gen-contact-info-parity --check  the SQL and TypeScript twins tested on identical cases
  #   check-claims     no copy promising emergency rescue, guaranteed help or location tracking
  #   check-env        .env.example matches what the code actually reads, both directions
  #
  # Verified to need no environment: the build completes with .env.local removed entirely.
  # ---------------------------------------------------------------------------
  verify:
    name: typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # MATCH THE npm THE LOCKFILE WAS WRITTEN WITH.
      #
      # CI failed at npm ci on every push from 2026-09-23 to 2026-09-30 -- 44 runs, five days,
      # unnoticed, because it fails before any of this project’s own code runs. The cause is not
      # Node and not a broken lockfile:
      #
      #   npm error code EUSAGE
      #   npm ci can only install packages when your package.json and package-lock.json are in sync
      #   Missing: @swc/helpers@0.5.23 from lock file
      #
      # npm 11 writes this lockfile and accepts it; npm 10, which ships with the Node images
      # here, rejects it. Reproduced by running npm@10 against a copy of package.json and
      # package-lock.json alone, which is also the only way to see it from a machine that has
      # npm 11 -- a local npm ci passes and tells you nothing.
      #
      # Pinned rather than regenerated with npm 10, so CI runs what the developer runs. The day
      # that stops being npm 11, this line is the thing to change, and it will say so loudly.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run verify

  # ---------------------------------------------------------------------------
  # The browser suite, against a Supabase this runner starts and throws away.
  #
  # IT USED TO BE GATED ON REPOSITORY SECRETS AND HAS THEREFORE NEVER RUN. The gate checked for
  # NEXT_PUBLIC_SUPABASE_URL, the secret was never added, and the job went green having skipped
  # every test in it -- a passing tick that meant nothing, for months.
  #
  # The obvious fix was to add the secrets. It is the wrong fix, twice over:
  #
  #   * The suite signs in as admin@ / mike@ / rosa@ / pending@winchup.test, which exist only in
  #     supabase/seeds/demo.sql -- and that seed REFUSES to run against production on purpose.
  #     Pointed at production the suite fails at the first sign-in screen.
  #   * The header here used to claim the suite was read-only. It is not, and has not been since
  #     the recovery-team work: it files requests, signs people up, posts to the community and
  #     publishes membership agreements. Against production those are real rows, a real rate
  #     limit, and stray accounts somebody has to go and delete by hand. Three were deleted on
  #     2026-09-30.
  #
  # So the runner gets its OWN Supabase: real Postgres, real GoTrue, the full migration history
  # and the demo seed. Nothing shared, nothing to leak, no secret to add, and the pgTAP suites
  # -- 885 assertions that have also never run here -- come along for free.
  # ---------------------------------------------------------------------------
  browsers:
    name: end-to-end (4 viewports, 2 engines)
    runs-on: ubuntu-latest
    # supabase start pulls images, then a production build, then the suite on one worker.
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # MATCH THE npm THE LOCKFILE WAS WRITTEN WITH.
      #
      # CI failed at npm ci on every push from 2026-09-23 to 2026-09-30 -- 44 runs, five days,
      # unnoticed, because it fails before any of this project’s own code runs. The cause is not
      # Node and not a broken lockfile:
      #
      #   npm error code EUSAGE
      #   npm ci can only install packages when your package.json and package-lock.json are in sync
      #   Missing: @swc/helpers@0.5.23 from lock file
      #
      # npm 11 writes this lockfile and accepts it; npm 10, which ships with the Node images
      # here, rejects it. Reproduced by running npm@10 against a copy of package.json and
      # package-lock.json alone, which is also the only way to see it from a machine that has
      # npm 11 -- a local npm ci passes and tells you nothing.
      #
      # Pinned rather than regenerated with npm 10, so CI runs what the developer runs. The day
      # that stops being npm 11, this line is the thing to change, and it will say so loudly.
      - run: npm install -g npm@11

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts Postgres, GoTrue, PostgREST and Storage in this runner and applies every
      # migration in supabase/migrations. Studio and the mail catcher are excluded because no
      # human is going to look at them here.
      - name: Start this runner's own Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      # The demo accounts, loaded deliberately rather than by config.toml's seed list -- that
      # list is reachable by `supabase db push --include-seed` and must stay reference-only.
      # mark-local.sql first: an unmarked database calls itself production and refuses this.
      - name: Load the demo data the suite signs in with
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -f scripts/local-stack/mark-local.sql \
            -f supabase/seeds/demo.sql

      # PROVE SIGN-IN WORKS BEFORE SPENDING TWENTY MINUTES FINDING OUT IT DOES NOT.
      #
      # The first run that got this far took 21 minutes to report 20 failures, every one a
      # page.waitForURL timeout after a sign-in -- which is an expensive way to be told that
      # signing in is broken. Nearly every spec signs in first, so this one call decides
      # whether the rest of the job is worth running.
      #
      # It makes the exact request the sign-in form makes. On failure it prints GoTrue's own
      # container log, because a 500 from this endpoint says "Database error querying schema"
      # and nothing else -- the actual Postgres error only exists in that log.
      - name: Can anybody sign in?
        run: |
          note() { echo "::error title=diag::$1"; }
          KEY="$(supabase status -o json | jq -r .ANON_KEY)"

          CODE=$(curl -s -o /tmp/grant.json -w '%{http_code}' \
            -X POST 'http://127.0.0.1:54321/auth/v1/token?grant_type=password' \
            -H "apikey: $KEY" -H 'content-type: application/json' \
            -d '{"email":"mike@winchup.test","password":"recovery-demo-2026"}')

          if [ "$CODE" = "200" ]; then
            echo "sign-in works ($CODE)"
            exit 0
          fi

          note "password grant returned $CODE"
          note "body=$(head -c 300 /tmp/grant.json | tr -d '\n')"

          for c in $(docker ps --format '{{.Names}}' | grep -i auth); do
            note "container $c"
            docker logs --tail 80 "$c" 2>&1 | grep -iE 'error|fatal|denied|null|panic' | tail -15 | while read -r line; do
              note "$(echo "$line" | cut -c1-280)"
            done
          done

          exit 1
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run the suite
        env:
          # This runner's own stack. The anon key is read from it rather than written down,
          # because supabase start mints one per run.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SITE_URL: http://localhost:3101
          # Optional, and absent here: without it the recovery-team suite still passes -- it
          # falls back to pasting coordinates and says so in the log -- but the map leg does not
          # run. A public, URL-restricted pk. token is what belongs in this secret.
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          # Belt and braces: nothing here should reach Twilio, and this makes certain of it.
          SMS_DRY_RUN: "1"
        run: |
          # BOTH keys, and the service-role one is not optional here.
          #
          # Every write path in this app goes through a server action holding the service role
          # -- filing a request, resolving /r/<token>, signing the membership agreement -- and
          # supabaseAdmin() THROWS when the key is missing. Giving the suite only the anon key
          # cost a full run: 11 failures that read as three unrelated features being broken
          # (the wizard never navigating, an unknown token showing "Something broke" instead of
          # "We couldn t find that", the agreement never signing) and were one absent variable.
          #
          # Production renders that unknown-token page correctly, which is how the difference
          # was placed in the environment rather than in the app.
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$(supabase status -o json | jq -r .ANON_KEY)"
          SUPABASE_SERVICE_ROLE_KEY="$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "no anon key from supabase status"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "no service role key from supabase status"; exit 1; }
          npm run test:e2e

      # AFTER the browser suite, for two reasons learned on the first run that got this far.
      #
      # It failed here in five seconds -- too fast to be assertions, so it is the runner not
      # starting -- and being second in line it took the browser suite down with it, which is
      # the thing this job exists to run. Order it last and a pgTAP problem costs pgTAP only.
      #
      # The other reason is quieter: `supabase test db` is entitled to reset the database it
      # runs against, and the demo accounts loaded above are what every browser spec signs in
      # with. Running it first risks pulling the rug out from under the suite in a way that
      # would look like a broken app.
      #
      # 885 assertions across nineteen suites, none of which have ever run on CI.
      - name: Database suites (pgTAP)
        run: |
          # Captured and echoed as annotations, because this step has failed in five seconds
          # on every run so far and the log needs admin rights to read. Five seconds is too
          # fast to be assertions, so it is the runner refusing to start -- and its reason has
          # been invisible.
          set +e
          out=$(supabase test db 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            # The FAILING lines, not the last lines. tail -25 caught the end of a run whose
            # suites were passing and told us nothing -- pg_prove prints its verdict in a few
            # specific shapes, so ask for those.
            echo "$out"               | grep -iE "not ok|^Failed|Result: FAIL|ERROR:|FATAL:|does not exist|Files=|Wstat|failed [0-9]"               | head -25               | while read -r line; do
                  echo "::error title=pgtap::$(echo "$line" | cut -c1-280)"
                done
          fi
          exit $code

      # WRITE THE DIAGNOSIS WHERE IT CAN BE READ WITHOUT ADMIN RIGHTS.
      #
      # Job logs need admin on this repository and artifacts are no better, so a failure here
      # has so far been a wall: "exit code 1", nothing else. Annotations are the exception --
      # they come back from the public API, which is how the Playwright github reporter's
      # failures were legible at all. `::error::` makes anything an annotation, so this step
      # turns the few facts that actually separate the likely causes into ones.
      #
      # It is deliberately about STATE, not about the test names: 20 specs timing out on
      # page.waitForURL after a sign-in says "sign-in did not work" and nothing about why. The
      # database either has the demo accounts or it does not; the app either got an anon key or
      # it did not. Those two answers pick the branch.
      - name: Say what went wrong, as annotations
        if: failure()
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          note() { echo "::error title=diag::$1"; }

          # Re-derived here: the key the suite used lived only in that step s own shell.
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$(supabase status -o json | jq -r .ANON_KEY)"

          note "users=$(psql "$DB" -At -c 'select count(*) from auth.users' 2>&1 | tr -d '\n')"
          note "demo users=$(psql "$DB" -At -c "select count(*) from auth.users where email like '%@winchup.test'" 2>&1 | tr -d '\n')"
          note "identities=$(psql "$DB" -At -c 'select coalesce(string_agg(provider || chr(61) || n, chr(44)), chr(45)) from (select provider, count(*)::text n from auth.identities group by provider) x' 2>&1 | tr -d '\n')"
          note "password verifies=$(psql "$DB" -At -c "select coalesce((select encrypted_password = extensions.crypt('recovery-demo-2026', encrypted_password) from auth.users where email = 'mike@winchup.test'), false)" 2>&1 | tr -d '\n')"
          note "responders=$(psql "$DB" -At -c 'select count(*) from public.responders' 2>&1 | tr -d '\n')"
          note "anon key length=${#NEXT_PUBLIC_SUPABASE_ANON_KEY}"

          # What GoTrue itself says to the exact call the sign-in form makes. This is the one
          # that distinguishes "the seed is wrong" from "the app never reached Supabase".
          note "token grant=$(curl -s -o /tmp/grant.json -w '%{http_code}' \
            -X POST 'http://127.0.0.1:54321/auth/v1/token?grant_type=password' \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H 'content-type: application/json' \
            -d '{"email":"mike@winchup.test","password":"recovery-demo-2026"}')"
          note "token body=$(head -c 300 /tmp/grant.json | tr -d '\n')"

          # GoTrue answered 500 "Database error querying schema", which is its way of saying a
          # query against the auth schema failed while telling you nothing about which one. Its
          # own container log carries the actual Postgres error and is the only place that does.
          for c in $(docker ps --format "{{.Names}}" | grep -i auth); do
            note "container $c"
            docker logs --tail 60 "$c" 2>&1 | grep -iE "error|fatal|denied|null" | tail -12 | while read -r line; do
              note "$(echo "$line" | cut -c1-280)"
            done
          done
          for f in test-results/*/error-context.md; do
            [ -e "$f" ] || continue
            note "$(basename "$(dirname "$f")"): $(tr '\n' ' ' < "$f" | head -c 400)"
          done

      - name: Keep the traces when something fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          # playwright-report/ is the HTML reporter's directory and CI uses the github
          # reporter, so it has never existed here -- every failed run logged "No files were
          # found" and uploaded nothing. test-results/ is where the traces and the
          # error-context.md files actually are, and those are the useful ones anyway.
          path: test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # NOT HERE: the 622 pgTAP assertions.
  #
  # They need Postgres with PostGIS and pgTAP, and pgTAP is not in any published PostGIS image --
  # locally it is installed by hand from a source tarball, which is not something to reproduce in
  # a workflow that has to be trustworthy. They are run with `supabase test db` against a local
  # database, or against the linked project before a release.
  #
  # Saying so here is better than a job that silently skips and turns the badge green.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Migrations reach production from here, because the Supabase GitHub integration stopped.
  #
  # On 1 October it applied nothing all day while Vercel deployed normally, and twenty-one
  # migrations went in by hand through the SQL editor. It leaves no trace in GitHub -- no commit
  # status, no check run, no deployment, on any commit including the day it demonstrably worked --
  # so there was nothing to watch and no way to notice. This job replaces a mechanism that reports
  # nowhere with one that goes red in the same place everything else does.
  #
  # IT RUNS ONLY IF THE SUITE PASSED. `needs` is both jobs, so schema cannot reach production from a
  # commit whose tests are red. That is a stronger guarantee than the integration ever gave: it
  # applied on push, test results be damned.
  #
  # WORST CASE IS A RED BUILD, NOT DAMAGE. The CLI applies each migration in its own transaction and
  # stops at the first failure, so a file that cannot run leaves the database as it was. That matters
  # here more than usual -- see the warning about the ledger below.
  #
  # THE LEDGER HAS TO BE RIGHT FIRST, and on 1 October it was not. `db push` applies every version
  # that supabase_migrations.schema_migrations does not list, and the twenty-one applied by hand are
  # almost certainly absent from it. Those twenty-one are safe to replay -- measured, not assumed:
  # all twenty-one were re-run against a database that already had them, zero failed. But SIXTEEN of
  # the other eighty-three are NOT replayable, because `create type`, `create table`, `create
  # trigger` and `create policy` are meant to run once in order. So if the ledger is behind on any of
  # those, the first run of this job goes red on "type already exists" and applies nothing.
  #
  # That is the safe failure, not the fix. The fix is to reconcile the ledger once:
  #
  #   select version, name from supabase_migrations.schema_migrations order by version desc;
  #   supabase migration repair --status applied <version>   -- for each already-applied version
  #
  # docs/apply-2026-10-01.md has the longer version.
  #
  # ONE SECRET, AND IT MUST BE THE SESSION POOLER, NOT THE DIRECT CONNECTION.
  #
  # This is measured, not a preference. The direct host resolves IPv6-only:
  #
  #   db.icpwyepfwkguaocbkawe.supabase.co   AAAA 2600:1f18:...   A (none)
  #   aws-0-<region>.pooler.supabase.com    A 44.208.221.186, ...
  #
  # GitHub's hosted runners have no IPv6, so a direct connection string fails here every time --
  # and it fails as a connection timeout, which reads like Supabase being down rather than like a
  # wrong address. The pooler is IPv4 and is what the dashboard labels "Session pooler".
  #
  # SESSION mode (port 5432), not transaction mode (6543). Migrations take advisory locks and run
  # multi-statement transactions; a transaction-mode pooler hands out a different backend per
  # statement and the lock is lost.
  #
  # The whole URL is the secret rather than just the password, because the dashboard prints the
  # exact host and username for this project and guessing a region into a workflow is how this
  # fails confusingly a month from now.
  #
  # THE PROJECT REF IS NOT A SECRET and is written in below rather than stored as one. It is the
  # subdomain of the project URL -- https://icpwyepfwkguaocbkawe.supabase.co -- which every request the browser
  # makes already carries. Keeping it in a secret would only add a third way for this job to skip
  # quietly. The access token and the database password are the real secrets, and they are not here.
  #
  # ORDER AGAINST VERCEL is not controlled from here. Both start on the same push; this job is
  # short and Vercel's build is not, so schema usually lands first, which is the safe direction.
  # It is not guaranteed, which is why CLAUDE.md's rule stands: a field an RPC has only just started
  # returning is OPTIONAL in its TypeScript type.
  # ---------------------------------------------------------------------------
  migrate:
    name: apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, browsers]

    # Pushes to main only. Never a pull request, never a fork: a PR from outside this repository
    # must not be able to run anything against the production database.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'imnotarobot360/winch-up' }}

    # One at a time, and never cancelled halfway. Two pushes racing to apply migrations is the one
    # thing worse than applying them late -- note this does NOT inherit the file-level concurrency
    # group above, which cancels in progress.
    concurrency:
      group: db-push-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # A MISSING SECRET IS NOW A FAILURE, and that is a reversal worth explaining.
      #
      # This used to set ready=false, print a ::notice and let the job go green -- reasoning that
      # "skipping loudly beats a red badge on every push until somebody adds them, and beats a
      # green one that quietly did nothing". It then delivered exactly the third thing. On
      # 2026-10-03 fifteen migrations were pushed, CI reported success three times, and NOTHING
      # reached production; the frontend deployed on top of a schema that did not have it. A
      # ::notice is invisible next to a green tick, and nobody reads the step list of a job that
      # passed.
      #
      # The premise was wrong, not the implementation. There is no longer a "not added yet" state
      # worth protecting: the secret is part of the deploy, and its absence means this push did not
      # finish. Red is the honest colour for that, and it is the only one anybody looks at.
      - name: Are the secrets here?
        id: secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$DB_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DB_URL is set (${#DB_URL} characters)."
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::error title=Migrations NOT applied::SUPABASE_DB_URL is empty or unset, so nothing was applied to production. The frontend may now be ahead of the schema."
          exit 1

      # WHICH NAMES CAN THIS JOB ACTUALLY SEE. Only on failure, so it costs nothing on a good run.
      #
      # "I added it" and "the workflow can read it" are different claims, and three ways of being
      # wrong look identical in the UI: the Variables tab instead of Secrets (secrets. cannot see a
      # variable), an Environment secret instead of a Repository one (this job declares no
      # environment), or Vercel's environment variables instead of GitHub's. This prints the KEYS
      # of the secrets context and never the values -- GitHub masks those anyway -- which settles
      # in one line whether the secret is absent, named something else, or present but empty.
      - name: Which secret names can this job see?
        if: ${{ failure() && steps.secrets.outputs.ready != 'true' }}
        env:
          ALL_SECRET_NAMES: ${{ toJSON(secrets) }}
        run: |
          echo "Secret names visible to this job:"
          printf '%s' "$ALL_SECRET_NAMES" | python3 -c 'import json,sys; [print(" -", k) for k in json.load(sys.stdin)]' || echo "  (could not parse)"
          echo ""
          echo "Expected: SUPABASE_DB_URL"
          echo "If it is not in that list, it is not a REPOSITORY secret on this repo."
          echo "  Settings -> Secrets and variables -> Actions -> Repository secrets"
          echo "Not the Variables tab, not an Environment secret, and not Vercel."
          echo ""
          echo "To apply by hand in the meantime: docs/apply-pending.sql (psql, session pooler)."

      # WHAT SHAPE IS THE CONNECTION STRING, AND CAN THIS RUNNER EVEN REACH IT.
      #
      # Added 2026-10-04, after the secret finally arrived and `migration list` STILL failed. The
      # advice step further down names three ways to get that string wrong, and a timeout looks
      # identical for all three -- two days went into guessing between them. This asks the string
      # and the network directly, before anything tries to authenticate, so "cannot reach it" and
      # "it refused me" stop looking alike.
      #
      # It lives in a SCRIPT rather than inline because an inline diagnostic cannot be tested, and
      # a diagnostic that fails for its own reasons is worse than none. scripts/check-db-url.sh is
      # run against one good and six bad strings, and the owner can run it by hand against their
      # own string without it reaching a shell history. It prints no password; see its header for
      # why it DOES print the host.
      - name: Is this string even reachable from here?
        if: steps.secrets.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/check-db-url.sh

      # What it is ABOUT to do, printed before it does it. `migration list` shows local versus
      # remote side by side, so the log answers "what changed" without anybody opening a dashboard --
      # and if the ledger is behind, this is where that becomes visible.
      - name: What does production already have?
        id: list
        if: steps.secrets.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$DB_URL"

      # WOULD THIS PUSH REPLAY HISTORY? Refuse if so, before db push gets the chance.
      #
      # Nineteen migrations went into production BY HAND between 2026-10-01 and 2026-10-04, because
      # both auto-apply paths were broken and neither said so. Applying by hand leaves
      # supabase_migrations.schema_migrations behind unless somebody remembers the insert, and the
      # files that did those inserts were overwritten batch by batch -- so the repo cannot say what
      # the ledger holds, and the first successful connection would find out by DOING it.
      #
      # db push applies, in order, every local migration the ledger does not list. If the ledger is
      # behind, that re-runs OLD migrations against a live database, and 20260920000600_rls.sql
      # opens with `revoke all on all tables in schema public from anon, authenticated` -- the
      # deny-by-default floor at the point in history where it sits, a demolition charge anywhere
      # else. CLAUDE.md records the symptom: 45 of 48 tables lose their grants.
      #
      # Forward-only is allowed at any count; anything OLDER than the newest recorded version is
      # refused. A count threshold would block a legitimate large deploy and still wave through a
      # single dangerous old file.
      - name: Would this replay history against production?
        if: steps.secrets.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/check-migration-ledger.sh

      - name: Apply what is missing
        id: push
        if: steps.secrets.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$DB_URL"

      # TWO DIFFERENT FAILURES, TWO DIFFERENT CAUSES, and one piece of advice for both was worse
      # than none. This used to fire on ANY failure once the secret was present and talk about the
      # migration ledger -- so on 2026-10-04, when the connection string turned out to be the
      # IPv6-only direct host and the job could not connect at all, it printed a confident
      # explanation about `schema_migrations` being behind. Wrong advice at the exact moment
      # somebody is looking for the right one.
      #
      # `migration list` is the first step that CONNECTS, so its failure is about reaching the
      # database. `db push` runs only after a successful connection, so its failure is about the
      # SQL or the ledger.
      - name: Why the connection failed, which is not the migration
        if: ${{ failure() && steps.list.outcome == 'failure' }}
        run: |
          echo "::error title=Could not reach the database::migration list failed before applying anything. Nothing was changed."
          echo "The connection string is the usual cause, and there are three ways to get it wrong:"
          echo "  1. THE DIRECT HOST IS IPv6-ONLY. db.<ref>.supabase.co has no A record, and GitHub's"
          echo "     runners have no IPv6, so it fails as a TIMEOUT that reads like Supabase being down."
          echo "     Use the SESSION POOLER: aws-0-<region>.pooler.supabase.com"
          echo "  2. PORT 5432, not 6543. Transaction mode hands out a different backend per statement,"
          echo "     so migrations lose the advisory lock they take."
          echo "  3. USERNAME postgres.<project-ref>, with the dot. A bare 'postgres' at the pooler"
          echo "     answers 'password authentication failed' -- a wrong username that reads as a"
          echo "     wrong password."
          echo "Dashboard -> Connect -> Session pooler -> URI gives all three correctly."

      # Read this when the APPLY goes red. By then the connection worked, so the likely cause is the
      # ledger rather than the SQL.
      - name: Why a failure here is usually not the migration
        if: ${{ failure() && steps.push.outcome == 'failure' }}
        run: |
          echo "::error title=Migrations did not apply::Nothing was changed -- each migration runs in its own transaction and the first failure stops the run."
          echo "If the error says 'already exists', the ledger is behind rather than the SQL being wrong:"
          echo "  supabase_migrations.schema_migrations does not list a version that IS applied,"
          echo "  so the CLI tried to run it again. Reconcile once with:"
          echo "    supabase migration repair --status applied <version>"
          echo "docs/apply-2026-10-01.md has the full procedure and the query that shows the divergence."
